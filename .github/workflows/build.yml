name: Liberty Neural Matrix - AU VST3 standalone
# v0.7 automatic amplifier visuals, manual mappings, detector tests (one batched build)
on:
  push:
    paths:
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neural-matrix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon - AU VST3 standalone
            os: macos-15
            artifact: neural-matrix-macos-arm64
          - name: Windows x64 - VST3 standalone
            os: windows-2022
            artifact: neural-matrix-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Preflight checks
        run: python scripts/preflight.py
      - name: Configure Release (macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure Release (Windows short paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP 'lnm-b'
          $depsDir = Join-Path $env:RUNNER_TEMP 'lnm-d'
          cmake -S . -B "$buildDir" -A x64 "-DFETCHCONTENT_BASE_DIR=$depsDir" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile (macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel 3
      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP 'lnm-b'
          cmake --build "$buildDir" --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test NAM architecture registrations (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test NAM architecture registrations (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir "$env:RUNNER_TEMP/lnm-b" -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate and package macOS bundles with preserved permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          release="$PWD/build/LibertyNeuralMatrix_artefacts/Release"
          exe="$release/Standalone/Liberty Neural Matrix.app/Contents/MacOS/Liberty Neural Matrix"
          test -x "$exe" || { echo "::error::Standalone executable missing or not executable"; exit 1; }
          test -d "$release/AU/Liberty Neural Matrix.component"
          test -d "$release/VST3/Liberty Neural Matrix.vst3"
          /usr/bin/lipo -archs "$exe" | /usr/bin/grep -qw arm64
          package="$RUNNER_TEMP/Liberty-Neural-Matrix-macOS-arm64"
          mkdir -p "$package"
          for format in Standalone AU VST3; do
            /usr/bin/ditto "$release/$format" "$package/$format"
          done
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$package" "$PWD/Liberty-Neural-Matrix-macOS-arm64.zip"
          /usr/bin/unzip -tq "$PWD/Liberty-Neural-Matrix-macOS-arm64.zip"
      - name: Upload preserved macOS ZIP
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Liberty-Neural-Matrix-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/lnm-b/LibertyNeuralMatrix_artefacts/
          if-no-files-found: error
          retention-days: 14
